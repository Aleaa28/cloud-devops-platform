apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrastructure-health-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infrastructure-health-api
  template:
    metadata:
      labels:
        app: infrastructure-health-api
    spec:
      containers:
        - name: infrastructure-health-api
          image: ghcr.io/aleaa28/cloud-devops-platform:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
