replicaCount: 2

image:
  repository: ghcr.io/aleaa28/cloud-devops-platform
  pullPolicy: IfNotPresent
  tag: latest

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 20
