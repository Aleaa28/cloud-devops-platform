apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-health-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Aleaa28/cloud-devops-platform.git
    targetRevision: main
    path: helm/infrastructure-health-api
    helm:
      releaseName: infrastructure-health-api
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
